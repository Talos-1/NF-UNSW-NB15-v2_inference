[project]
name = "nf-unsw-nb15-v2-inference"
version = "0.1.0"
description = "LightGBM binary intrusion detection on NF-UNSW-NB15-v2 with batched inference server."
authors = [
    {name = "Talos-1",email = "adityaprayoga@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
